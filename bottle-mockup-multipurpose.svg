<svg xmlns="http://www.w3.org/2000/svg" width="500" height="700" viewBox="0 0 500 700">
  <title>FreClean Multi-Purpose Cleaner — CONCEPT bottle silhouette (not final product photography)</title>
  <defs>
    <linearGradient id="grad-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0A6ECA"/>
      <stop offset="100%" stop-color="#21975D"/>
    </linearGradient>
    <linearGradient id="grad-label" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0A6ECA"/>
      <stop offset="100%" stop-color="#4FA022"/>
    </linearGradient>
  </defs>

  <rect width="500" height="700" fill="#F7F9FA"/>

  <!-- bottle cap -->
  <rect x="215" y="40" width="70" height="50" rx="8" fill="#DDE3E7" stroke="#B9C2C9" stroke-width="2"/>
  <!-- bottle neck -->
  <rect x="225" y="85" width="50" height="40" fill="#EDEFF1" stroke="#B9C2C9" stroke-width="2"/>
  <!-- bottle shoulders + body (generic silhouette) -->
  <path d="M180,125
           C180,125 175,170 175,200
           L175,600
           C175,630 200,650 250,650
           C300,650 325,630 325,600
           L325,200
           C325,170 320,125 320,125
           Z"
        fill="url(#grad-body)" fill-opacity="0.18" stroke="url(#grad-body)" stroke-width="4"/>

  <!-- label -->
  <rect x="195" y="300" width="110" height="180" rx="10" fill="white" stroke="#0A6ECA" stroke-width="3"/>
  <rect x="195" y="300" width="110" height="34" rx="10" fill="url(#grad-label)"/>
  <text x="250" y="323" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">FreClean</text>
  <text x="250" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#222222">Multi-Purpose</text>
  <text x="250" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#222222">Cleaner</text>
  <text x="250" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#595959">SIZE: TBD</text>
  <text x="250" y="426" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#595959">SKU: FRC-MP-CL-TBD</text>

  <!-- watermark -->
  <text x="250" y="670" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#B33A00">CONCEPT — NOT FINAL PRODUCT PHOTOGRAPHY</text>
  <text x="250" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#8A8A8A">Schematic illustration only · freclean-products/assets/products/concepts/</text>
</svg>
